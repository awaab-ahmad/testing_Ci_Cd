name: Matrix Added

on: 
  push:
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-latest
    strategy: 
      fail-test: false
      matrix: 
        flutter-version: ['3.40', '3.44', '3.50']

    steps:
      - name: Setting up of the cloud virtual machine 
        uses: actions/checkout@v4

      - name: Set up SDK on the cloud engine
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-verion }}
          cache: True   

      - name: Run the Flutter tests
        run: flutter test
  
  build: 
    needs: setup
    runs-on: ubuntu-latest

    steps: 
      - name: Setting the Machine
        uses: actions/checkout@v4           

      - name: Setting the flutter engine
        uses: subosito/flutter-action@v2
        with: 
          flutter-version: '3.50'
          cache: True

      - name: Performing clean
        run: flutter clean

      - name: Run Pub get
        run: flutter pub get
      
      - name: Build the app in formats
        run: flutter build apk --split-per-abi

      - name: Uploading the Files to Cloud
        uses: actions/upload-artifact@v4
        with: 
          name: Released Apks
          path: build/app/outputs/flutter-apk/
