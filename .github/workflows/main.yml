name: State Added

on: 
  push:
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Setting up of the cloud virtual machine 
        uses: actions/checkout@v4

      - name: Set up SDK on the cloud engine
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: True   

      - name: Run the Flutter pub get
        run: flutter pub get

      - name: Running the dart formatter
        run: dart format --set-exit-if-changed .

      - name: Running the flutter analyzer
        run: flutter analyze

      - name: Run the Flutter tests
        run: flutter test
  
  build: 
    needs: setup
    runs-on: ubuntu-latest

    steps: 
      - name: Setting the Machine
        uses: actions/checkout@v4

      - name: Setting the flutter engine
        uses: subosito/flutter-action@v2
        with: 
          channel: stable
          cache: True

      - name: Run Pub get
        run: flutter pub get
      
      - name: Build the app in formats
        run: flutter build apk --split-per-abi

      - name: Uploading the Files to Cloud
        uses: actions/uplaod-artifact@v4
        with: 
          name: Released Apks
          path: build/app/outputs/flutter-apk/